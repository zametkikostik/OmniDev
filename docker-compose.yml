services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://omnidev:omnidev@postgres:5432/omnidev}
      - ALLOW_OLLAMA=${ALLOW_OLLAMA:-1}
      - PLATFORM_LLM_PROVIDER=${PLATFORM_LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.3}
      - ADMIN_SECRET=${ADMIN_SECRET:-change-me}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - PREVIEW_BASE_URL=${PREVIEW_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omnidev
      POSTGRES_PASSWORD: omnidev
      POSTGRES_DB: omnidev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/preview:/srv/preview
      - caddy_data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
