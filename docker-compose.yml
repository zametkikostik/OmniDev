services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://omnidev:omnidev@db:5432/omnidev
      - ADMIN_SECRET=${ADMIN_SECRET:-change-me}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PLATFORM_LLM_PROVIDER=openrouter
      - PLATFORM_LLM_MODEL=anthropic/claude-sonnet-4
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - ALLOW_USER_BYOK=0
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omnidev
      POSTGRES_PASSWORD: omnidev
      POSTGRES_DB: omnidev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata:
